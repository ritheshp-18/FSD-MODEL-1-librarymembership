<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Member Management</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Library Member Management</h1>

        <div class="card">

            <h2>Add New Member</h2>

            <form id="memberForm">

                <label>Member ID</label>
                <input type="text" id="memberId" required>

                <label>Name</label>
                <input type="text" id="name" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Phone</label>
                <input type="text" id="phone" maxlength="10" required>

                <label>Department</label>
                <input type="text" id="department" required>

                <label>Membership Type</label>
                <select id="membershipType" required>
                    <option value="">Select Type</option>
                    <option value="Student">Student</option>
                    <option value="Faculty">Faculty</option>
                    <option value="Premium">Premium</option>
                </select>

                <button type="submit">Add Member</button>

            </form>

            <p id="message"></p>

        </div>


        <div class="card">

            <h2>Find Membership Type</h2>

            <label>Enter Member ID</label>

            <input type="text" id="searchMemberId">

            <button onclick="findMembership()">
                Search
            </button>

            <div id="result"></div>

        </div>


        <div class="card">

            <h2>All Members</h2>

            <button onclick="loadMembers()">
                Display Members
            </button>

            <div id="members"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
